dth="1.2"/><text x="307.5" y="547.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">9: 200 Cùng một thông</text><text x="307.5" y="561.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">báo cho mọi trường hợp</text><line x1="64.0" y1="616.0" x2="223.0" y2="616.0" stroke="#222222" stroke-width="1.2"/><polygon points="214.8,619.8 223.0,616.0 214.8,612.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="143.5" y="593.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">10: Mở liên kết, nhập</text><text x="143.5" y="607.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mật khẩu mới</text><line x1="233.0" y1="676.0" x2="382.0" y2="676.0" stroke="#222222" stroke-width="1.2"/><polygon points="373.8,679.8 382.0,676.0 373.8,672.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="307.5" y="639.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">11: POST</text><text x="307.5" y="653.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">/api/auth/reset-password</text><text x="307.5" y="667.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">{token, newPassword}</text><polyline points="392.0,702.0 426.0,702.0 426.0,720.0 398.0,720.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="405.3,716.6 398.0,720.0 405.3,723.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="432.0" y="710.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">12: Băm mật khẩu</text><text x="432.0" y="724.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">mới (bcrypt)</text><line x1="392.0" y1="818.0" x2=