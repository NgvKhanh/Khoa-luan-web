ợp lệ]</text><line x1="64.0" y1="168.0" x2="212.0" y2="168.0" stroke="#222222" stroke-width="1.2"/><polygon points="203.8,171.8 212.0,168.0 203.8,164.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="138.0" y="131.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1: Mở liên kết</text><text x="138.0" y="145.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">/verify-email?token=…</text><text x="138.0" y="159.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trong email</text><line x1="222.0" y1="228.0" x2="364.0" y2="228.0" stroke="#222222" stroke-width="1.2"/><polygon points="355.8,231.8 364.0,228.0 355.8,224.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="293.0" y="191.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">2: POST</text><text x="293.0" y="205.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">/api/auth/verify-email</text><text x="293.0" y="219.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">{token}</text><polyline points="374.0,254.0 408.0,254.0 408.0,272.0 380.0,272.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="387.3,268.6 380.0,272.0 387.3,275.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="414.0" y="262.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">3: Băm mã nhận</text><text x="414.0" y="276.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">được (SHA-256)</text><line x1="374.0" y1="370.0" x2="513.0" y2="370.0" stroke="#222222" stroke-width="1.2"/><polygon points="504.8,373.8 513.0,370.0 504.8,366.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="443.5" y="319.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">4: Giao dịch: đánh dấu</text><text x="443.5" y="333.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mã đã dùng (chỉ khi</text><text x="443.5" y="347.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chưa dùng, còn hạn);</text><text x="443.5" y="361.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">ghi emailVerifiedAt</text><line x1="518.0" y1="402.0" x2="374.0" y2="402.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="382.2,398.2 374.0,402.0 382.2,405.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="446.0" y="393.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">5: Kết quả</text><line x1="369.0" y1="480.0" x2="222.0" y2="480.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="230.2,476.2 222.0,480.0 230.2,483.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="295.5" y="457.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">6: 400 Liên kết không</text><text x="295.5" y="471.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hợp lệ hoặc đã hết hạn</text><line x1="212.0" y1="526.0" x2="64.0" y2="526.0" stroke="#222222" stroke-width="1.2"/><polyline points="72.2,522.2 64.0,526.0 72.2,529.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="138.0" y="503.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">7: Báo lỗi; có thể gửi lại</text><text x="138.0" y="517.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email từ banner</text><line x1="369.0" y1="584.0" x2="222.0" y2="584.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="230.2,580.2 222.0,584.0 230.2,587.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="295.5" y="575.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">8: 200 {user}</text><line x1="212.0" y1="630.0" x2="64.0" y2="630.0" stroke="#222222" stroke-width="1.2"/><polyline points="72.2,626.2 64.0,630.0 72.2,633.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="138.0" y="607.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">9: Báo xác minh thành</text><text x="138.0" y="621.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">công, ẩn banner nhắc</text></svg>