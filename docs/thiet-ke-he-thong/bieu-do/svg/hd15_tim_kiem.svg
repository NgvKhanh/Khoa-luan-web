oke="#222222" stroke-width="1.2"/><polyline points="164.8,921.8 173.0,918.0 164.8,914.2" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="95.0" y="741.0" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="135.0" y="749.0" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="243.5,840.0 463.0,840.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="454.8,843.8 463.0,840.0 454.8,836.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="605.0,864.0 605.0,918.0 207.0,918.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="215.2,914.2 207.0,918.0 215.2,921.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="190.0,935.0 190.0,960.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="186.2,951.8 190.0,960.0 193.8,951.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="190.0,1008.0 190.0,1036.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="186.2,1027.8 190.0,1036.0 193.8,1027.8" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="190.0" cy="78.0" r="11" fill="#222222"/><rect x="121.0" y="122.0" width="138.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="190.0" y="138.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở trang Tìm kiếm</text><polygon points="190.0,185.5 252.9,210.0 190.0,234.5 127.1,210.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="190.0" y="210.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Bộ lọc đã lưu?</text><rect x="20.5" y="266.0" width="159.0" height="80.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="100.0" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Nhập từ khoá; chọn</text><text x="100.0" y="298.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">người phụ trách, nhãn,</text><text x="100.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trạng thái, quá hạn,</text><text x="100.0" y="330.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khoảng ngày hết hạn</text><rect x="220.5" y="282.0" width="139.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="290.0" y="298.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn một bộ lọc đã</text><text x="290.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">lưu</text><polygon points="190.0,379.0 207.0,396.0 190.0,413.0 173.0,396.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="525.0" y="428.0" width="160.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="605.0" y="444.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra tham số (Zod)</text><rect x="435.0" y="490.0" width="340.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="605.0" y="506.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chỉ xét các bảng người dùng được xem: là chủ bảng,</text><text x="605.0" y="522.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thành viên bảng, bảng mức Không gian làm việc trong</text><text x="605.0" y="538.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">không gian của mình, bảng Công khai</text><rect x="431.0" y="588.0" width="348.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="605.0" y="604.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghép điều kiện (lọc quá hạn luôn kèm chưa xong); đếm</text><text x="605.0" y="620.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tổng, lấy một trang 20 thẻ sắp theo hạn</text><rect x="98.5" y="674.0" width="183.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="190.0" y="690.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem kết quả, chuyển trang</text><polygon points="190.0,737.5 242.8,762.0 190.0,786.5 137.2,762.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="190.0" y="762.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu bộ lọc?</text><rect x="136.5" y="824.0" width="107.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="190.0" y="840.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đặt tên bộ lọc</text><rect x="463.0" y="816.0" width="284.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="605.0" y="832.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu bộ lọc theo tên (trùng tên thì ghi đè điều</text><text x="605.0" y="848.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">kiện)</text><polygon points="190.0,901.0 207.0,918.0 190.0,935.0 173.0,918.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="83.0" y="960.0" width="214.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="190.0" y="976.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở thẻ cần xem trên bảng chứa</text><text x="190.0" y="992.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thẻ</text><circle cx="190.0" cy="1050.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="190.0" cy="1050.0" r="8" fill="#222222"/></svg>