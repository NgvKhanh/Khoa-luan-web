 x="22.5" y="200.0" width="161.0" height="80.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="103.0" y="216.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở hộp thoại tạo bảng;</text><text x="103.0" y="232.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">nhập tên, chọn không</text><text x="103.0" y="248.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">gian và nền (màu hoặc</text><text x="103.0" y="264.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">ảnh Unsplash)</text><rect x="211.0" y="208.0" width="158.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="290.0" y="224.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn một mẫu (của hệ</text><text x="290.0" y="240.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thống hoặc đã lưu) và</text><text x="290.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">không gian</text><polygon points="195.0,313.0 212.0,330.0 195.0,347.0 178.0,330.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="462.0" y="368.0" width="306.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="615.0" y="384.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra người tạo là thành viên của không gian</text><polygon points="615.0,431.5 679.4,456.0 615.0,480.5 550.6,456.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="615.0" y="456.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Là thành viên?</text><rect x="97.5" y="432.0" width="195.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="195.0" y="448.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo lỗi không có quyền trong</text><text x="195.0" y="464.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">không gian</text><circle cx="195.0" cy="528.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="195.0" cy="528.0" r="8" fill="#222222"/><polygon points="615.0,509.5 656.3,534.0 615.0,558.5 573.7,534.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="615.0" y="534.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Từ mẫu?</text><rect x="412.0" y="594.0" width="186.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="610.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo bảng với tên và nền đã</text><text x="505.0" y="626.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chọn</text><rect x="625.0" y="594.0" width="200.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="725.0" y="610.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo bảng kèm các danh sách</text><text x="725.0" y="626.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(có trạng thái) và thẻ của mẫu</text><polygon points="615.0,679.0 632.0,696.0 615.0,713.0 598.0,696.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="451.5" y="738.0" width="327.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="615.0" y="754.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Người tạo là Chủ sở hữu