xt><text x="20.0" y="844.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#444444" font-style="italic">AiRun và AssignRun vừa phục vụ chức năng, vừa là nhật ký thực nghiệm cho Chương 6.</text></svg>