ke-width="1.2"/><polyline points="171.2,1105.8 175.0,1114.0 178.8,1105.8" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="175.0" cy="78.0" r="11" fill="#222222"/><rect x="78.5" y="120.0" width="193.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kéo thẻ và thả vào vị trí mới</text><text x="175.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(cùng hoặc khác danh sách)</text><rect x="477.5" y="120.0" width="245.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="600.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Hiển thị ngay vị trí mới trên giao diện,</text><text x="600.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">lưu ảnh chụp để hoàn tác</text><rect x="467.5" y="198.0" width="265.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="600.0" y="214.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra quyền sửa thẻ, quyền sửa bảng</text><text x="600.0" y="230.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chứa danh sách đích</text><polygon points="600.0,275.5 649.2,300.0 600.0,324.5 550.8,300.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="600.0" y="300.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Có quyền?</text><rect x="98.0" y="284.0" width="154.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Hoàn tác vị trí, báo lỗi</text><rect x="431.5" y="360.0" width="337.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="600.0" y="376.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trong một giao dịch: cập nhật danh sách và vị trí của</text><text x="600.0" y="392.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thẻ, đánh lại vị trí các thẻ ở danh sách nguồn và đích</text><polygon points="600.0,443.5 696.1,468.0 600.0,492.5 503.9,468.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="600.0" y="468.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Sang danh sách khác?</text><polygon points="540.0,520.0 663.6,552.0 540.0,584.0 416.4,552.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="540.0" y="544.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Danh sách đích có gắn</text><text x="540.0" y="559.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trạng thái?</text><rect x="431.0" y="612.0" width="218.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="628.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đổi trạng thái thẻ theo danh sách</text><text x="540.0" y="644.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đích</text><polygon points="540.0,685.0 557.0,702.0 540.0,719.0 523.0,702.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="387.0" y="744.0" width="306.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="760.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghi nhật ký hoạt động, gửi thông báo cho người</text><text x="540.0" y="776.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">phụ trách và người theo dõi thẻ</text><rect x="395.5" y="822.0" width="289.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="838.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chạy các luật tự động "thẻ được chuyển vào</text><text x="540.0" y="854.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">danh sách" đang bật</text><polygon points="600.0,901.0 617.0,918.0 600.0,935.0 583.0,918.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="449.0" y="954.0" width="302.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="600.0" y="970.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Phát sự kiện board:lists-changed tới phòng của</text><text x="600.0" y="986.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bảng</text><rect x="53.0" y="1024.0" width="244.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="1040.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Màn hình của các thành viên khác</text><text x="175.0" y="1056.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đang mở bảng tự tải lại danh sách và</text><text x="175.0" y="1072.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thẻ</text><circle cx="175.0" cy="1128.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="175.0" cy="1128.0" r="8" fill="#222222"/></svg>