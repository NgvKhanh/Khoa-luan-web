FF" stroke="#222222" stroke-width="1.1"/><rect x="220.0" y="154.0" width="10.0" height="694.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="44.0" y="444.0" width="219.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="47.0" y="452.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222" font-style="italic">[Không có tài khoản hoặc sai mật khẩu]</text><rect x="15.0" y="584.0" width="94.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="18.0" y="592.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222" font-style="italic">[Thông tin đúng]</text><line x1="64.0" y1="154.0" x2="220.0" y2="154.0" stroke="#222222" stroke-width="1.2"/><polygon points="211.8,157.8 220.0,154.0 211.8,150.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="142.0" y="131.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1: Nhập email, mật khẩu,</text><text x="142.0" y="145.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bấm Đăng nhập</text><line x1="230.0" y1="200.0" x2="371.0" y2="200.0" stroke="#222222" stroke-width="1.2"/><polygon points="362.8,203.8 371.0,200.0 362.8,196.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="300.5" y="177.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">2: POST /api/auth/login</text><text x="300.5" y="191.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">{email, password}</text><polyline points="381.0,226.0 415.0,226.0 415.0,244.0 387.0,244.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="394.3,240.6 387.0,244.0 394.3,247.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="421.0" y="234.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">3: Giới hạn số lần</text><text x="421.0" y="248.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">thử, kiểm tra dữ liệu</text><text x="421.0" y="262.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">(Zod)</text><line x1="381.0" y1="328.0" x2="531.0" y2="328.0" stroke="#222222" stroke-width="1.2"/><polygon points="522.8,331.8 531.0,328.0 522.8,324.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="456.0" y="305.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">4: loginUser(email,</text><text x="456.0" y="319.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">password)</text><line x1="541.0" y1="374.0" x2="688.0" y2="374.0" stroke="#222222" stroke-width="1.2"/><polygon points="679.8,377.8 688.0,374.0 679.8,370.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="614.5" y="351.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">5: Tìm người dùng theo</text><text x="614.5" y="365.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email</text><line x1="693.0" y1="420.0" x2="541.0" y2="420.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="549.2,416.2 541.0,420.0 549.2,423.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="617.0" y="397.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">6: User (passwordHash,</text><text x="617.0" y="411.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tokenVersion)</text><line x1="536.0" y1="484.0" x2="381.0" y2="484.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,480.2 381.0,484.0 389.2,487.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="458.5" y="475.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">7: Lỗi 401</text><line x1="376.0" y1="530.0" x2="230.0" y2="530.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="238.2,526.2 230.0,530.0 238.2,533.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="303.0" y="507.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">8: 401 Email hoặc mật</text><text x="303.0" y="521.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khẩu không đúng</text><line x1="220.0" y1="562.0" x2="64.0" y2="562.0" stroke="#222222" stroke-width="1.2"/><polyline points="72.2,558.2 64.0,562.0 72.2,565.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="142.0" y="553.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">9: Hiển thị lỗi</text><polyline points="541.0,614.0 575.0,614.0 575.0,632.0 547.0,632.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="554.3,628.6 547.0,632.0 554.3,635.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="581.0" y="622.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">10: So khớp mật</text><text x="581.0" y="636.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">khẩu (bcrypt), ký</text><text x="581.0" y="650.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">JWT {userId,</text><text x="581.0" y="664.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">tokenVersion}</text><line x1="536.0" y1="716.0" x2="381.0" y2="716.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,712.2 381.0,716.0 389.2,719.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="458.5" y="707.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">11: user, token</text><line x1="376.0" y1="762.0" x2="230.0" y2="762.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="238.2,758.2 230.0,762.0 238.2,765.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="303.0" y="739.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">12: 200 + Set-Cookie:</text><text x="303.0" y="753.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">token (httpOnly)</text><line x1="220.0" y1="808.0" x2="64.0" y2="808.0" stroke="#222222" stroke-width="1.2"/><polyline points="72.2,804.2 64.0,808.0 72.2,811.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="142.0" y="785.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">13: Chuyển về trang</text><text x="142.0" y="799.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trước đó</text></svg>