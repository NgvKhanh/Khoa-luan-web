.9" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="466.0" y="335.9" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="381.9,298.4 340.0,298.4 340.0,510.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="336.2,501.8 340.0,510.0 343.8,501.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="331.9" y="280.4" width="39.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="367.9" y="288.4" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Chưa]</text><polyline points="477.0,373.8 682.5,373.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="674.3,377.6 682.5,373.8 674.3,370.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="770.0,405.8 770.0,430.5" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="766.2,422.3 770.0,430.5 773.8,422.3" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="712.1,455.0 582.5,455.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="590.7,451.2 582.5,455.0 590.7,458.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="675.1" y="437.0" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="698.1" y="445.0" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="480.0,423.0 480.0,411.5 460.0,411.5 460.0,390.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="463.8,399.0 460.0,390.8 456.2,399.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="770.0,479.5 770.0,542.0 636.5,542.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="644.7,538.2 636.5,542.0 644.7,545.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="773.0" y="484.5" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="776.0" y="492.5" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="340.0,574.0 340.0,617.4 443.0,617.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="434.8,621.2 443.0,617.4 434.8,613.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="545.0,566.0 545.0,617.4 477.0,617.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="485.2,613.6 477.0,617.4 485.2,621.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="460.0,634.4 460.0,665.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="456.2,657.0 460.0,665.2 463.8,657.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="460.0,697.2 460.0,756.6 236.0,756.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="244.2,752.8 236.0,756.6 244.2,760.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="130.0,788.6 130.0,812.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="126.2,804.0 130.0,812.2 133.8,804.0" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="130.0" cy="78.0" r="11" fill="#222222"/><rect x="25.0" y="117.8" width="210.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="130.0" y="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở trợ lý ảo; phạm vi mặc định</text><text x="130.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">theo trang đang mở</text><rect x="31.5" y="193.2" width="197.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="130.0" y="209.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Gõ câu hỏi bằng ngôn ngữ tự</text><text x="130.0" y="225.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">nhiên</text><rect x="301.5" y="193.2" width="317.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="209.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Giới hạn tần suất, mỗi người một câu tại một thời</text><text x="460.0" y="225.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">điểm; kiểm tra quyền với phạm vi</text><polygon points="460.0,273.9 538.1,298.4 460.0,322.9 381.9,298.4" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="460.0" y="298.4" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đã cấu hình LLM?</text><polygon points="460.0,356.8 477.0,373.8 460.0,390.8 443.0,373.8" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="682.5" y="341.8" width="175.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="770.0" y="357.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn công cụ truy vấn và</text><text x="770.0" y="373.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tham số; hoặc kết thúc,</text><text x="770.0" y="389.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hỏi lại</text><polygon points="770.0,430.5 827.9,455.0 770.0,479.5 712.1,455.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="770.0" y="455.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Gọi công cụ?</text><rect x="377.5" y="423.0" width="205.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="480.0" y="439.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra tham số (Zod), giới</text><text x="480.0" y="455.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hạn phạm vi; chạy truy vấn chỉ</text><text x="480.0" y="471.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đọc có kiểm tra quyền</text><rect x="262.5" y="510.0" width="155.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="340.0" y="526.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chế độ cơ bản: hiểu</text><text x="340.0" y="542.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">câu hỏi bằng luật, truy</text><text x="340.0" y="558.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">vấn tương ứng</text><rect x="453.5" y="518.0" width="183.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="545.0" y="534.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghép các khối kết quả có</text><text x="545.0" y="550.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">nguồn, hoặc câu hỏi làm rõ</text><polygon points="460.0,600.4 477.0,617.4 460.0,634.4 443.0,617.4" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="337.0" y="665.2" width="246.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="681.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu lượt hỏi đáp vào lịch sử hội thoại</text><rect x="24.0" y="724.6" width="212.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="130.0" y="740.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem câu trả lời và các khối kết</text><text x="130.0" y="756.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">quả; chọn phương án nếu được</text><text x="130.0" y="772.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hỏi lại; xem thêm trang</text><circle cx="130.0" cy="826.2" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="130.0" cy="826.2" r="8" fill="#222222"/></svg>