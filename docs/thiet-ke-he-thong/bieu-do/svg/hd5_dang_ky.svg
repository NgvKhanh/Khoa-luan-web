 508.8,651.3" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="454.3,684.0 258.5,684.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="266.7,680.2 258.5,684.0 266.7,687.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="400.3" y="666.0" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="440.3" y="674.0" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="155.0,716.0 155.0,742.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="151.2,733.8 155.0,742.0 158.8,733.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="505.0,708.5 505.0,746.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="501.2,737.8 505.0,746.0 508.8,737.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="508.0" y="713.5" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="511.0" y="721.5" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="505.0,778.0 505.0,840.0 259.5,840.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="267.7,836.2 259.5,840.0 267.7,843.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="155.0,864.0 155.0,892.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="151.2,883.8 155.0,892.0 158.8,883.8" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="155.0" cy="78.0" r="11" fill="#222222"/><rect x="45.5" y="120.0" width="219.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Nhập họ tên, email, mật khẩu (tối</text><text x="155.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thiểu 6 ký tự)</text><rect x="364.0" y="120.0" width="282.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Giới hạn số lần đăng ký; kiểm tra dữ liệu và</text><text x="505.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email chưa được dùng</text><polygon points="505.0,197.5 542.7,222.0 505.0,246.5 467.3,222.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="505.0" y="222.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Hợp lệ?</text><rect x="54.0" y="198.0" width="202.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="214.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo lỗi: dữ liệu sai hoặc email</text><text x="155.0" y="230.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đã được sử dụng</text><rect x="355.5" y="276.0" width="299.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="292.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Băm mật khẩu (bcrypt); tạo tài khoản và không</text><text x="505.0" y="308.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">gian làm việc cá nhân</text><rect x="348.0" y="348.0" width="314.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="364.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo mã xác minh dùng một lần (chỉ lưu SHA-256,</text><text x="505.0" y="380.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hạn 24 giờ)</text><rect x="722.5" y="348.0" width="125.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="785.0" y="364.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Gửi email chứa</text><text x="785.0" y="380.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">liên kết xác minh</text><rect x="347.5" y="432.0" width="315.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="448.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ký JWT, đặt cookie httpOnly (đăng nhập luôn); lỗi</text><text x="505.0" y="464.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">gửi email không chặn việc đăng ký</text><rect x="49.5" y="510.0" width="211.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="526.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Vào trang chủ; banner nhắc xác</text><text x="155.0" y="542.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">minh email</text><rect x="64.0" y="582.0" width="182.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="598.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở liên kết xác minh trong</text><text x="155.0" y="614.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email</text><rect x="355.5" y="582.0" width="299.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="598.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trong một giao dịch: đánh dấu mã đã dùng, chỉ</text><text x="505.0" y="614.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khi mã đúng, chưa dùng, còn hạn</text><polygon points="505.0,659.5 555.7,684.0 505.0,708.5 454.3,684.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="505.0" y="684.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mã hợp lệ?</text><rect x="51.5" y="652.0" width="207.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="668.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo liên kết không hợp lệ hoặc</text><text x="155.0" y="684.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hết hạn; có thể gửi lại email từ</text><text x="155.0" y="700.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">banner</text><circle cx="155.0" cy="756.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="155.0" cy="756.0" r="8" fill="#222222"/><rect x="406.5" y="746.0" width="197.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="762.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghi thời điểm xác minh email</text><rect x="50.5" y="816.0" width="209.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="832.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thấy thông báo xác minh thành</text><text x="155.0" y="848.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">công, banner nhắc biến mất</text><circle cx="155.0" cy="906.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="155.0" cy="906.0" r="8" fill="#222222"/></svg>