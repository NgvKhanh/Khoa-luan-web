<svg xmlns="http://www.w3.org/2000/svg" width="775" height="770" viewBox="0 0 775 770" font-family="Arial, Helvetica, sans-serif"><rect width="775" height="770" fill="#FFFFFF"/><rect x="20.0" y="20.0" width="720.0" height="140.0" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1.2"/><text x="32.0" y="36.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Trình duyệt người dùng</text><rect x="40.0" y="48.0" width="680.0" height="98.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="380.0" y="62.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Ứng dụng trang đơn (SPA): React 19, TypeScript, Vite, Tailwind CSS</text><text x="54.0" y="84.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Trang và thành phần giao diện: bảng Kanban (kéo-thả @dnd-kit), chi tiết thẻ, lịch, tìm kiếm, hồ sơ, hộp thoại AI, trợ lý ảo</text><text x="54.0" y="98.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Context: AuthContext, BoardsContext, WorkspacesContext, AssistantContext, ThemeContext</text><text x="54.0" y="112.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Lớp gọi API (Axios, gửi kèm cookie) và kết nối Socket.IO dùng chung (singleton)</text><rect x="20.0" y="220.0" width="720.0" height="330.0" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1.2"/><text x="32.0" y="236.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Máy chủ ứng dụng: Node.js, Express, TypeScript (chạy trong Docker)</text><rect x="40.0" y="250.0" width="680.0" height="48.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="380.0" y="266.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Middleware: CORS, đọc cookie, requireAuth (JWT + tokenVersion), kiểm tra dữ liệu (Zod), giới hạn tần suất, kiểm</text><text x="380.0" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">soát tệp tải lên</text><rect x="40.0" y="312.0" width="170.0" height="64.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="125.0" y="336.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Router + Controller</text><text x="125.0" y="352.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">(REST /api/...)</text><rect x="230.0" y="312.0" width="490.0" height="64.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="475.0" y="336.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Tầng nghiệp vụ (service): kiểm tra quyền (assertBoardView / Access /</text><text x="475.0" y="352.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Manage / Owner) trước mọi thao tác</text><rect x="40.0" y="390.0" width="430.0" height="146.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"/><text x="255.0" y="404.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Các module nghiệp vụ</text><text x="54.0" y="426.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">auth, workspace, board (thành viên, chia sẻ, công khai), list, card, label,</text><text x="54.0" y="440.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">customField, automation, search, activity, notification, watch, unsplash</text><text x="54.0" y="454.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">ai: sinh bảng (tầng luật + LLM + BoardPlan)</text><text x="54.0" y="468.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">assign, declaredProfile: gợi ý phân công</text><text x="54.0" y="482.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">chat: trợ lý ảo</text><rect x="490.0" y="390.0" width="230.0" height="66.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="605.0" y="415.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Realtime hub Socket.IO (phòng</text><text x="605.0" y="431.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">user:*, board:*)</text><rect x="490.0" y="470.0" width="230.0" height="66.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="605.0" y="495.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Bộ lập lịch: nhắc hạn, thẻ định kỳ,</text><text x="605.0" y="511.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">email tổng hợp</text><rect x="20.0" y="600.0" width="350.0" height="150.0" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1.2"/><text x="32.0" y="616.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Lưu trữ</text><rect x="40.0" y="628.0" width="310.0" height="52.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="195.0" y="646.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">PostgreSQL 16 (Docker), truy cập qua Prisma</text><text x="195.0" y="662.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">ORM</text><rect x="40.0" y="690.0" width="310.0" height="46.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="195.0" y="705.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thư mục tệp tải lên (ảnh nền, ảnh đại diện, đính</text><text x="195.0" y="721.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">kèm, CV)</text><rect x="390.0" y="600.0" width="350.0" height="150.0" rx="8" fill="#FFFDF5" stroke="#666666" stroke-width="1.2"/><text x="402.0" y="616.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Dịch vụ bên ngoài</text><rect x="410.0" y="630.0" width="150.0" height="50.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="485.0" y="655.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Gemini API (LLM)</text><rect x="570.0" y="630.0" width="150.0" height="50.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="645.0" y="647.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Máy chủ SMTP</text><text x="645.0" y="663.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">(Nodemailer)</text><rect x="410.0" y="688.0" width="150.0" height="50.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="485.0" y="705.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Google Identity (đăng</text><text x="485.0" y="721.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">nhập)</text><rect x="570.0" y="688.0" width="150.0" height="50.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="645.0" y="705.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Unsplash API (ảnh</text><text x="645.0" y="721.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">nền)</text><polyline points="312.0,146.0 312.0,250.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="307.8,240.9 312.0,250.0 316.2,240.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="316.2,155.1 312.0,146.0 307.8,155.1" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="244.0" y="175.0" width="136.0" height="30.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="312.0" y="183.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">HTTPS: REST/JSON,</text><text x="312.0" y="197.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cookie httpOnly chứa JWT</text><polyline points="652.0,146.0 652.0,190.0 756.0,190.0 756.0,423.0 720.0,423.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="729.1,418.8 720.0,423.0 729.1,427.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="656.2,155.1 652.0,146.0 647.8,155.1" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="620.5" y="175.0" width="63.0" height="30.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="652.0" y="183.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">WebSocket</text><text x="652.0" y="197.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(Socket.IO)</text><polyline points="125.0,298.0 125.0,312.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="120.8,302.9 125.0,312.0 129.2,302.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="210.0,344.0 230.0,344.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="220.9,348.2 230.0,344.0 220.9,339.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="381.9,376.0 381.9,390.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="377.7,380.9 381.9,390.0 386.1,381.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="470.0,423.0 490.0,423.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="480.9,427.2 490.0,423.0 480.9,418.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="490.0,503.0 470.0,503.0 470.0,502.4" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="474.2,511.5 470.0,502.4 465.8,511.5" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="212.0,536.0 212.1,628.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="207.8,618.9 212.1,628.0 216.3,618.9" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="237.0" y="566.0" width="70.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="272.0" y="574.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Prisma Client</text><polyline points="405.5,536.0 405.5,713.0 350.0,713.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="359.1,708.8 350.0,713.0 359.1,717.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="720.0,344.0 745.0,344.0 745.0,575.0 565.0,575.0 565.0,600.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="560.8,590.9 565.0,600.0 569.2,590.9" fill="none" stroke="#222222" stroke-width="1.2"/></svg>