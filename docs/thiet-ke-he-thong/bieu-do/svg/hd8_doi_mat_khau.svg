e="central" fill="#222222">Xác thực phiên (JWT, tokenVersion); kiểm</text><text x="585.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tra dữ liệu</text><polygon points="585.0,197.5 645.8,222.0 585.0,246.5 524.2,222.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="585.0" y="222.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Có mật khẩu?</text><rect x="65.5" y="190.0" width="229.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="180.0" y="206.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo tài khoản Google chưa có mật</text><text x="180.0" y="222.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khẩu, hướng dẫn dùng Quên mật</text><text x="180.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khẩu</text><circle cx="180.0" cy="294.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="180.0" cy="294.0" r="8" fill="#222222"/><rect x="471.0" y="284.0" width="228.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="585.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">So khớp mật khẩu hiện tại (bcrypt)</text><polygon points="585.0,347.5 617.7,372.0 585.0,396.5 552.3,372.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="585.0" y="372.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đúng?</text><rect x="68.0" y="356.0" width="224.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="180.0" y="372.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo mật khẩu hiện tại không đúng</text><rect x="431.0" y="426.0" width="308.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="585.0" y="442.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu mật khẩu mới đã băm và tăng tokenVersion</text><text x="585.0" y="458.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trong cùng một lần cập nhật</text><rect x="424.0" y="506.0" width="322.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="585.0" y="522.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ngắt mọi kết nối Socket.IO đang mở của tài khoản</text><rect x="424.5" y="570.0" width="321.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="585.0" y="586.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ký JWT mới theo tokenVersion mới, đặt lại cookie</text><text x="585.0" y="602.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cho phiên hiện tại</text><rect x="475.0" y="651.0" width="220.0" height="6.0" rx="0" fill="#222222" stroke="#222222" stroke-width="1.2"/><rect x="62.0" y="702.0" width="236.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="180.0" y="718.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Giao diện kết nối lại Socket.IO bằng</text><text x="180.0" y="734.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cookie mới; tiếp tục làm việc</text><rect x="435.5" y="702.0" width="299.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="585.0" y="718.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Từ chối (401) yêu cầu mang JWT cũ từ thiết bị</text><text x="585.0" y="734.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khác; người dùng ở đó phải đăng nhập lại</text><rect x="475.0" y="795.0" width="220.0" height="6.0" rx="0" fill="#222222" stroke="#222222" stroke-width="1.2"/><circle cx="585.0" cy="858.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="585.0" cy="858.0" r="8" fill="#222222"/></svg>