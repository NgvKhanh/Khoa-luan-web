-width="1.2"/><rect x="765.0" y="277.0" width="120.0" height="30.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="825.0" y="285.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">giao người; lựa chọn và</text><text x="825.0" y="299.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">kết quả được ghi nhận</text></svg>