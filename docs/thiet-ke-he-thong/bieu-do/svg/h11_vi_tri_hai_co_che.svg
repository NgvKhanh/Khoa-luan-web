ht="86.0" rx="6" fill="#FFF6D9" stroke="#1F4E79" stroke-width="1.3"/><text x="787.5" y="95.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem trước và xác nhận</text><polyline points="170.0,71.0 195.0,71.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="185.9,75.2 195.0,71.0 185.9,66.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="170.0,119.0 195.0,119.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="185.9,123.2 195.0,119.0 185.9,114.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="485.0,71.0 510.0,71.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="500.9,75.2 510.0,71.0 500.9,66.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="485.0,119.0 510.0,119.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="500.9,123.2 510.0,119.0 500.9,114.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="670.0,95.0 695.0,95.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="685.9,99.2 695.0,95.0 685.9,90.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="200.0" y="200.0" width="520.0" height="72.0" rx="6" fill="#F4F4F4" stroke="#666666" stroke-width="1.3"/><text x="460.0" y="214.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Nền tảng TaskFlow (môi trường thực nghiệm)</text><text x="214.0" y="236.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Không gian làm việc → bảng → danh sách → thẻ; lịch sử thẻ, người thực hiện, hạn, nhật ký hoạt động</text><text x="214.0" y="250.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Phân quyền, cập nhật thời gian thực, thông báo, tự động hóa, trợ lý ảo</text><polyline points="787.5,138.0 787.5,175.0 560.0,175.0 560.0,200.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="555.8,190.9 560.0,200.0 564.2,190.9" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="613.0" y="167.0" width="122.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="674.0" y="175.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">ghi bảng (một giao dịch)</text><rect x="20.0" y="320.0" width="880.0" height="200.0" rx="8" fill="#F3FAF3" stroke="#666666" stroke-width="1.2"/><text x="32.0" y="336.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Cơ chế 2: Gợi ý người thực hiện</text><rect x="40.0" y="356.0" width="130.0" height="88.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="105.0" y="370.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Thẻ mới</text><text x="54.0" y="392.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">hoặc các thẻ chưa</text><text x="54.0" y="406.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">có người trong một</text><text x="54.0" y="420.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">danh sách</text><rect x="200.0" y="356.0" width="150.0" height="88.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="275.0" y="370.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Truy hồi K công việc</text><text x="275.0" y="386.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">tương tự</text><text x="214.0" y="408.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">và đối chiếu hồ sơ tự</text><text x="214.0" y="422.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">khai</text><rect x="370.0" y="356.0" width="190.0" height="88.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="465.0" y="370.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Chấm từng thành phần</text><text x="384.0" y="392.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">kinh nghiệm, độ ổn định,</text><text x="384.0" y="406.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">khả năng tiếp nhận, hồ sơ;</text><text x="384.0" y="420.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">mức đủ dữ liệu, bằng chứng</text><rect x="580.0" y="356.0" width="170.0" height="88.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="665.0" y="370.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Xếp hạng theo trọng số</text><text x="665.0" y="386.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">của nhóm</text><text x="594.0" y="408.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">chia việc theo đợt, cộng dồn</text><text x="594.0" y="422.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">tải</text><rect x="770.0" y="356.0" width="110.0" height="88.0" rx="6" fill="#FFF6D9" stroke="#1F4E79" stroke-width="1.3"/><text x="825.0" y="392.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Người quản lý</text><text x="825.0" y="408.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">quyết định</text><rect x="580.0" y="466.0" width="170.0" height="40.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="665.