ize="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="392.0,814.6 358.0,814.6 358.0,721.8 442.6,721.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="434.4,725.6 442.6,721.8 434.4,718.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="617.4,721.8 790.0,721.8 790.0,907.4 761.0,907.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="769.2,903.6 761.0,907.4 769.2,911.2" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="607.0" y="700.8" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="610.0" y="708.8" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="620.0,931.4 620.0,957.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="616.2,949.0 620.0,957.2 623.8,949.0" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="175.0" cy="78.0" r="11" fill="#222222"/><rect x="47.0" y="115.6" width="256.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="131.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở Tự động hoá; đặt tên luật, chọn</text><text x="175.0" y="147.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">điều kiện: thẻ được tạo, hoặc thẻ được</text><text x="175.0" y="163.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chuyển vào một danh sách</text><rect x="54.0" y="210.6" width="242.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="226.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn 1–5 hành động: đánh dấu xong,</text><text x="175.0" y="242.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">gắn nhãn, giao thành viên; bấm Lưu</text><rect x="421.5" y="210.6" width="317.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="580.0" y="226.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra quyền sửa bảng; danh sách, nhãn, thành</text><text x="580.0" y="242.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">viên được chọn phải thuộc bảng</text><polygon points="580.0,285.5 617.7,310.0 580.0,334.5 542.3,310.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="580.0" y="310.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Hợp lệ?</text><rect x="105.5" y="294.0" width="139.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="310.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo lỗi, sửa lại luật</text><rect x="430.0" y="361.4" width="300.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="580.0" y="377.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu luật (mặc định đang bật) và các hành động</text><text x="580.0" y="393.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">theo thứ tự</text><rect x="64.5" y="431.0" width="221.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="447.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thấy luật trong danh sách; có thể</text><text x="175.0" y="463.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tạm tắt hoặc bật lại</text><circle cx="175.0" cy="518.8" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="175.0" cy="518.8" r="8" fill="#222222"/><circle cx="580.0" cy="518.8" r="11" fill="#222222"/><rect x="424.5" y="552.8" width="311.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="580.0" y="568.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Một thẻ được tạo trong bảng, hoặc được chuyển</text><text x="580.0" y="584.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">sang danh sách khác</text><rect x="422.0" y="622.4" width="316.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="580.0" y="638.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tìm các luật đang bật của bảng khớp loại sự kiện</text><text x="580.0" y="654.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">và danh sách</text><polygon points="530.0,697.3 617.4,721.8 530.0,746.3 442.6,721.8" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="530.0" y="721.8" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Còn luật chưa chạy?</text><rect x="392.0" y="774.6" width="276.0" height="80.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="530.0" y="790.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chạy lần lượt các hành động (đánh dấu</text><text x="530.0" y="806.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">xong, gắn nhãn, giao thành viên kèm thông</text><text x="530.0" y="822.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">báo); lỗi của một luật chỉ ghi nhật ký,</text><text x="530.0" y="838.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">không làm hỏng thao tác chính</text><rect x="479.0" y="883.4" width="282.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="620.0" y="899.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Phát board:lists-changed; màn hình của các</text><text x="620.0" y="915.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thành viên tải lại bảng</text><circle cx="620.0" cy="971.2" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="620.0" cy="971.2" r="8" fill="#222222"/></svg>