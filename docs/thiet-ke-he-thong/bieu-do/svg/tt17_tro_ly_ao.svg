" stroke-width="1.2"/><text x="510.5" y="645.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">8: Kết quả</text><polyline points="377.0,722.0 411.0,722.0 411.0,740.0 383.0,740.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="390.3,736.6 383.0,740.0 390.3,743.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="417.0" y="730.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">9: Chế độ cơ bản:</text><text x="417.0" y="744.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">hiểu câu hỏi bằng</text><text x="417.0" y="758.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">luật, truy vấn tương</text><text x="417.0" y="772.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">ứng</text><line x1="377.0" y1="868.0" x2="639.0" y2="868.0" stroke="#222222" stroke-width="1.2"/><polygon points="630.8,871.8 639.0,868.0 630.8,864.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="508.0" y="831.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">10: Lưu lượt hỏi đáp</text><text x="508.0" y="845.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(ChatConversation,</text><text x="508.0" y="859.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">ChatTurn)</text><line x1="644.0" y1="900.0" x2="377.0" y2="900.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="385.2,896.2 377.0,900.0 385.2,903.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="510.5" y="891.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">11: Đã ghi</text><line x1="372.0" y1="946.0" x2="