<svg xmlns="http://www.w3.org/2000/svg" width="731" height="974" viewBox="0 0 731 974" font-family="Arial, Helvetica, sans-serif"><rect width="731" height="974" fill="#FFFFFF"/><rect x="10.0" y="396.0" width="707.0" height="540.0" rx="0" fill="none" stroke="#555555" stroke-width="1.1"/><polygon points="10.0,396.0 39.0,396.0 39.0,408.0 31.0,416.0 10.0,416.0" fill="#EEEEEE" stroke="#555555" stroke-width="1.1"/><text x="16.0" y="406.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">alt</text><line x1="10.0" y1="472.0" x2="717.0" y2="472.0" stroke="#555555" stroke-width="1.1" stroke-dasharray="6 4"/><circle cx="64.0" cy="28.0" r="8" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/><line x1="64.0" y1="36.0" x2="64.0" y2="56.0" stroke="#000" stroke-width="1.5"/><line x1="50.0" y1="43.0" x2="78.0" y2="43.0" stroke="#000" stroke-width="1.5"/><line x1="64.0" y1="56.0" x2="53.0" y2="72.0" stroke="#000" stroke-width="1.5"/><line x1="64.0" y1="56.0" x2="75.0" y2="72.0" stroke="#000" stroke-width="1.5"/><text x="64.0" y="82.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Khách</text><line x1="64.0" y1="94.0" x2="64.0" y2="962.0" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/><rect x="176.0" y="38.0" width="84.0" height="54.0" rx="0" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="218.0" y="57.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Giao diện</text><text x="218.0" y="73.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">(React)</text><line x1="218.0" y1="94.0" x2="218.0" y2="962.0" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/><rect x="309.5" y="38.0" width="133.0" height="54.0" rx="0" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="376.0" y="57.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Máy chủ</text><text x="376.0" y="73.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">(API, AuthService)</text><line x1="376.0" y1="94.0" x2="376.0" y2="962.0" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/><path d="M489.5,36.0 v48.0 a47.5,8 0 0 0 95.0,0 v-48.0" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><ellipse cx="537.0" cy="36.0" rx="47.5" ry="8" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="537.0" y="56.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">CSDL</text><text x="537.0" y="72.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">PostgreSQL</text><line x1="537.0" y1="94.0" x2="537.0" y2="962.0" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/><rect x="602.5" y="38.0" width="105.0" height="54.0" rx="0" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="655.0" y="57.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Dịch vụ email</text><text x="655.0" y="73.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">(SMTP)</text><line x1="655.0" y1="94.0" x2="655.0" y2="962.0" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/><rect x="376.0" y="254.0" width="10.0" height="48.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="532.0" y="342.0" width="10.0" height="32.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="371.0" y="214.0" width="10.0" height="238.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="376.0" y="518.0" width="10.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="532.0" y="606.0" width="10.0" height="32.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="532.0" y="698.0" width="10.0" height="32.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="650.0" y="776.0" width="10.0" height="46.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="371.0" y="472.0" width="10.0" height="396.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="213.0" y="154.0" width="10.0" height="800.0" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.1"/><rect x="44.0" y="398.0" width="140.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="47.0" y="406.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222" font-style="italic">[Email đã được sử dụng]</text><rect x="15.0" y="474.0" width="137.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="18.0" y="482.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222" font-style="italic">[Email chưa được dùng]</text><line x1="64.0" y1="154.0" x2="213.0" y2="154.0" stroke="#222222" stroke-width="1.2"/><polygon points="204.8,157.8 213.0,154.0 204.8,150.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="138.5" y="131.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">1: Nhập họ tên, email,</text><text x="138.5" y="145.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mật khẩu; bấm Đăng ký</text><line x1="223.0" y1="214.0" x2="371.0" y2="214.0" stroke="#222222" stroke-width="1.2"/><polygon points="362.8,217.8 371.0,214.0 362.8,210.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="297.0" y="177.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">2: POST</text><text x="297.0" y="191.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">/api/auth/register {name,</text><text x="297.0" y="205.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email, password}</text><polyline points="381.0,240.0 415.0,240.0 415.0,258.0 387.0,258.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="394.3,254.6 387.0,258.0 394.3,261.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="421.0" y="248.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">3: Giới hạn tần suất,</text><text x="421.0" y="262.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">kiểm tra dữ liệu</text><text x="421.0" y="276.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">(Zod)</text><line x1="381.0" y1="342.0" x2="532.0" y2="342.0" stroke="#222222" stroke-width="1.2"/><polygon points="523.8,345.8 532.0,342.0 523.8,338.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="456.5" y="319.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">4: Tìm người dùng theo</text><text x="456.5" y="333.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email</text><line x1="537.0" y1="374.0" x2="381.0" y2="374.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,370.2 381.0,374.0 389.2,377.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="459.0" y="365.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">5: Kết quả</text><line x1="376.0" y1="452.0" x2="223.0" y2="452.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="231.2,448.2 223.0,452.0 231.2,455.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="299.5" y="429.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">6: 409 Email này đã</text><text x="299.5" y="443.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">được sử dụng</text><polyline points="381.0,504.0 415.0,504.0 415.0,522.0 387.0,522.0" fill="none" stroke="#222222" stroke-width="1.2"/><polygon points="394.3,518.6 387.0,522.0 394.3,525.4" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="421.0" y="512.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">7: Băm mật khẩu</text><text x="421.0" y="526.0" font-size="12" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">(bcrypt)</text><line x1="381.0" y1="606.0" x2="532.0" y2="606.0" stroke="#222222" stroke-width="1.2"/><polygon points="523.8,609.8 532.0,606.0 523.8,602.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="456.5" y="569.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">8: Tạo User; tạo</text><text x="456.5" y="583.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Workspace cá nhân</text><text x="456.5" y="597.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(OWNER)</text><line x1="537.0" y1="638.0" x2="381.0" y2="638.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,634.2 381.0,638.0 389.2,641.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="459.0" y="629.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">9: user</text><line x1="381.0" y1="698.0" x2="532.0" y2="698.0" stroke="#222222" stroke-width="1.2"/><polygon points="523.8,701.8 532.0,698.0 523.8,694.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="456.5" y="661.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">10: Lưu AuthToken</text><text x="456.5" y="675.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">EMAIL_VERIFY</text><text x="456.5" y="689.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">(SHA-256, hạn 24 giờ)</text><line x1="537.0" y1="730.0" x2="381.0" y2="730.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,726.2 381.0,730.0 389.2,733.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="459.0" y="721.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">11: Đã ghi</text><line x1="381.0" y1="776.0" x2="650.0" y2="776.0" stroke="#222222" stroke-width="1.2"/><polygon points="641.8,779.8 650.0,776.0 641.8,772.2" fill="#222222" stroke="#222222" stroke-width="1.2"/><text x="515.5" y="753.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">12: Gửi email chứa liên</text><text x="515.5" y="767.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">kết xác minh</text><line x1="655.0" y1="822.0" x2="381.0" y2="822.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="389.2,818.2 381.0,822.0 389.2,825.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="518.0" y="799.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">13: Kết quả gửi (lỗi chỉ</text><text x="518.0" y="813.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">ghi nhật ký)</text><line x1="376.0" y1="868.0" x2="223.0" y2="868.0" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 4"/><polyline points="231.2,864.2 223.0,868.0 231.2,871.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="299.5" y="845.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">14: 201 + Set-Cookie:</text><text x="299.5" y="859.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">token (httpOnly)</text><line x1="213.0" y1="914.0" x2="64.0" y2="914.0" stroke="#222222" stroke-width="1.2"/><polyline points="72.2,910.2 64.0,914.0 72.2,917.8" fill="none" stroke="#222222" stroke-width="1.2"/><text x="138.5" y="891.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">15: Vào trang chủ, hiện</text><text x="138.5" y="905.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">banner nhắc xác minh</text></svg>