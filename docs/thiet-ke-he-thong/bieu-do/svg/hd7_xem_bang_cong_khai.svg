hấy</text><text x="175.0" y="236.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bảng, kèm liên kết đăng nhập</text><circle cx="175.0" cy="300.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="175.0" cy="300.0" r="8" fill="#222222"/><rect x="402.0" y="280.0" width="336.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="570.0" y="296.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trả tên, nền bảng, các danh sách và thẻ đang hoạt</text><text x="570.0" y="312.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">động; người dùng chỉ kèm tên và ảnh đại diện, không</text><text x="570.0" y="328.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">kèm email</text><rect x="81.5" y="374.0" width="187.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="390.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem bảng ở chế độ chỉ đọc</text><polygon points="175.0,437.5 230.0,462.0 175.0,486.5 120.0,462.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="175.0" y="462.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở một thẻ?</text><rect x="407.5" y="516.0" width="325.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="570.0" y="532.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra thẻ và danh sách chứa thẻ còn hoạt động,</text><text x="570.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bảng vẫn ở chế độ Công khai</text><rect x="398.5" y="594.0" width="343.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="570.0" y="610.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trả chi tiết thẻ: nhãn, ngày, thành viên, checklist, bình</text><text x="570.0" y="626.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">luận, tệp đính kèm (chỉ đọc)</text><rect x="65.0" y="672.0" width="220.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="175.0" y="688.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem chi tiết thẻ; tải tệp đính kèm</text><text x="175.0" y="704.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">nếu cần</text><polygon points="175.0,745.0 192.0,762.0 175.0,779.0 158.0,762.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><circle cx="175.0" cy="822.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="175.0" cy="822.0" r="8" fill="#222222"/></svg>