e points="434.8,899.6 443.0,895.8 434.8,892.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="565.0,830.6 565.0,895.8 477.0,895.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="485.2,892.0 477.0,895.8 485.2,899.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="460.0,912.8 460.0,933.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="456.2,925.2 460.0,933.4 463.8,925.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="460.0,997.4 460.0,1040.8 254.0,1040.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="262.2,1037.0 254.0,1040.8 262.2,1044.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="145.0,1072.8 145.0,1090.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="141.2,1082.4 145.0,1090.6 148.8,1082.4" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="760.0" cy="78.0" r="11" fill="#222222"/><rect x="654.0" y="117.8" width="212.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="760.0" y="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo liên kết mời, gửi cho người</text><text x="760.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">muốn mời</text><rect x="332.5" y="117.8" width="255.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Sinh mã mời ngẫu nhiên, duy nhất, gắn</text><text x="460.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">với bảng</text><rect x="39.0" y="199.0" width="212.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="145.0" y="215.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở liên kết mời (đăng nhập nếu</text><text x="145.0" y="231.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chưa)</text><rect x="298.5" y="199.0" width="323.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="215.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tìm bảng theo mã mời; xem người mở đã là thành</text><text x="460.0" y="231.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">viên, đang chờ duyệt hay chưa</text><polygon points="460.0,279.7 510.7,304.2 460.0,328.7 409.3,304.2" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="460.0" y="304.2" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mã hợp lệ?</text><rect x="32.5" y="280.2" width="225.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="145.0" y="296.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo liên kết không hợp lệ hoặc đã</text><text x="145.0" y="312.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bị thu hồi</text><circle cx="145.0" cy="368.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="145.0" cy="368.0" r="8" fill="#222222"/><polygon points="460.0,359.2 556.4,391.2 460.0,423.2 363.6,391.2" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="460.0" y="383.7" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đã tham gia hoặc</text><text x="460.0" y="398.7" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đang chờ?</text><rect x="43.5" y="423.0" width="203.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="145.0" y="439.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở bảng nếu đã là thành viên,</text><text x="145.0" y="455.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hoặc thấy yêu cầu đang chờ</text><text x="145.0" y="471.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">duyệt</text><circle cx="145.0" cy="518.8" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="145.0" cy="518.8" r="8" fill="#222222"/><rect x="347.0" y="456.4" width="226.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="472.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trả tên và nền bảng để xem trước</text><rect x="42.0" y="552.8" width="206.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="145.0" y="568.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem trước bảng; bấm Gửi yêu</text><text x="145.0" y="584.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cầu tham gia</text><rect x="303.5" y="628.2" width="313.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="644.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu yêu cầu (đang chờ); thông báo cho các quản</text><text x="460.0" y="660.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">trị viên bảng; phát board:join-requests-changed</text><rect x="655.5" y="628.2" width="209.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="760.0" y="644.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Nhận thông báo, mở danh sách</text><text x="760.0" y="660.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">yêu cầu tham gia</text><polygon points="760.0,703.1 794.1,727.6 760.0,752.1 725.9,727.6" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="760.0" y="727.6" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Duyệt?</text><rect x="284.0" y="782.6" width="202.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="385.0" y="798.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trong một giao dịch: đánh dấu</text><text x="385.0" y="814.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đã duyệt, thêm người yêu cầu</text><text x="385.0" y="830.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">với vai trò Thành viên</text><rect x="493.0" y="798.6" width="144.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="565.0" y="814.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đánh dấu đã từ chối</text><polygon points="460.0,878.8 477.0,895.8 460.0,912.8 443.0,895.8" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="307.0" y="933.4" width="306.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="460.0" y="949.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Thông báo kết quả cho người yêu cầu; cập nhật</text><text x="460.0" y="965.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">danh sách yêu cầu và thành viên theo thời gian</text><text x="460.0" y="981.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thực</text><rect x="36.0" y="1008.8" width="218.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="145.0" y="1024.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Nhận thông báo; nếu được duyệt</text><text x="145.0" y="1040.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thì vào bảng với vai trò Thành</text><text x="145.0" y="1056.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">viên</text><circle cx="145.0" cy="1104.6" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="145.0" cy="1104.6" r="8" fill="#222222"/></svg>