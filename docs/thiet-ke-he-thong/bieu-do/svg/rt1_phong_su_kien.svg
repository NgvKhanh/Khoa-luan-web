<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640" font-family="Arial, Helvetica, sans-serif"><rect width="780" height="640" fill="#FFFFFF"/><rect x="20.0" y="70.0" width="210.0" height="130.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"/><text x="125.0" y="84.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Tầng nghiệp vụ</text><text x="34.0" y="106.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">emitToBoard(boardId, sự kiện)</text><text x="34.0" y="120.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">emitToUser(userId, sự kiện)</text><text x="34.0" y="134.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">evictUserFromBoardRoom</text><text x="34.0" y="148.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">reconcileBoardRoomAccess</text><text x="34.0" y="162.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">disconnectUserSockets</text><rect x="270.0" y="20.0" width="270.0" height="490.0" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1.2"/><text x="282.0" y="36.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Máy chủ Socket.IO</text><rect x="286.0" y="52.0" width="238.0" height="96.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="405.0" y="66.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Bắt tay kết nối</text><text x="300.0" y="88.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Xác thực JWT + tokenVersion từ cookie</text><text x="300.0" y="102.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Tự vào phòng user:&lt;id&gt;</text><text x="300.0" y="116.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">join-board: kiểm tra quyền xem rồi mới vào</text><text x="300.0" y="130.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">phòng</text><rect x="286.0" y="164.0" width="238.0" height="156.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="405.0" y="178.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Phòng board:&lt;id&gt;</text><text x="300.0" y="200.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Kết nối của những người đang mở bảng</text><text x="300.0" y="214.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:lists-changed</text><text x="300.0" y="228.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:members-changed</text><text x="300.0" y="242.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:meta-changed</text><text x="300.0" y="256.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:join-requests-changed</text><text x="300.0" y="270.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:presence</text><rect x="286.0" y="336.0" width="238.0" height="156.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="405.0" y="350.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Phòng user:&lt;id&gt;</text><text x="300.0" y="372.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Mọi kết nối của một người dùng</text><text x="300.0" y="386.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:removed</text><text x="300.0" y="400.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">board:access-changed</text><text x="300.0" y="414.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">workspace:changed</text><text x="300.0" y="428.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">notification:new</text><rect x="580.0" y="170.0" width="180.0" height="56.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="670.0" y="190.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Trình duyệt A (đang mở</text><text x="670.0" y="206.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">bảng X)</text><rect x="580.0" y="246.0" width="180.0" height="56.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="670.0" y="266.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Trình duyệt B (đang mở</text><text x="670.0" y="282.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">bảng X)</text><rect x="580.0" y="390.0" width="180.0" height="56.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="670.0" y="410.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Trình duyệt C (người</text><text x="670.0" y="426.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">nhận thông báo)</text><rect x="20.0" y="530.0" width="740.0" height="92.0" rx="6" fill="#FFFDF5" stroke="#1F4E79" stroke-width="1.3"/><text x="390.0" y="544.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Phản ứng ở giao diện</text><text x="34.0" y="566.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Trang bảng và cửa sổ chi tiết thẻ lắng nghe độc lập; chờ 400 ms để gộp sự kiện rồi gọi lại API REST tải dữ liệu</text><text x="34.0" y="580.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Bỏ qua lượt tải lại khi người dùng đang gõ tiêu đề hoặc mô tả để không mất bản nháp</text><text x="34.0" y="594.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Mất kết nối rồi kết nối lại: tự vào lại phòng bảng và tải bù dữ liệu</text><polyline points="230.0,109.0 258.0,109.0 258.0,210.8 286.0,210.8" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="276.9,215.0 286.0,210.8 276.9,206.6" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="214.0" y="152.0" width="68.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="248.0" y="160.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">emitToBoard</text><polyline points="230.0,161.0 250.0,161.0 250.0,382.8 286.0,382.8" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="276.9,387.0 286.0,382.8 276.9,378.6" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="212.5" y="292.0" width="63.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="244.0" y="300.0" font-size="11" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">emitToUser</text><polyline points="524.0,198.0 580.0,198.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="570.9,202.2 580.0,198.0 570.9,193.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="524.0,274.0 580.0,274.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="570.9,278.2 580.0,274.0 570.9,269.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="524.0,418.1 580.0,418.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="570.9,422.2 580.0,418.0 570.9,413.8" fill="none" stroke="#222222" stroke-width="1.2"/></svg>