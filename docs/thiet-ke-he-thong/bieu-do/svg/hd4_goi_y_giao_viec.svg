ne" stroke="#222222" stroke-width="1.2"/><polyline points="586.2,494.6 590.0,502.8 593.8,494.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="496.5,518.8 277.0,518.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="285.2,515.0 277.0,518.8 285.2,522.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="170.0,542.8 170.0,575.5" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="166.2,567.3 170.0,575.5 173.8,567.3" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="170.0,624.5 170.0,667.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="166.2,659.0 170.0,667.2 173.8,659.0" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="173.0" y="629.5" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="176.0" y="637.5" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="260.3,600.0 590.0,600.0 590.0,657.2" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="586.2,649.0 590.0,657.2 593.8,649.0" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="271.3" y="582.0" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="274.3" y="590.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="590.0,705.2 590.0,734.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="586.2,726.6 590.0,734.8 593.8,726.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="590.0,766.8 590.0,800.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="586.2,791.8 590.0,800.0 593.8,791.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="590.0,864.0 590.0,887.1 500.0,887.1 500.0,900.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="496.2,892.6 500.0,900.8 503.8,892.6" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="593.0" y="869.0" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="596.0" y="877.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="783.3,832.0 765.0,832.0 765.0,994.4 607.0,994.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="615.2,990.6 607.0,994.4 615.2,998.2" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="729.3" y="814.0" width="43.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="769.3" y="822.0" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="500.0,948.8 500.0,994.4 573.0,994.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="564.8,998.2 573.0,994.4 564.8,990.6" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="590.0,1011.4 590.0,1038.4" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="586.2,1030.2 590.0,1038.4 593.8,1030.2" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="170.0" cy="78.0" r="11" fill="#222222"/><rect x="61.5" y="117.8" width="217.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="170.0" y="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở chi tiết thẻ, xem gợi ý người</text><text x="170.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">phụ trách</text><rect x="449.5" y="117.8" width="281.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra quyền sửa thẻ (người xem bảng bị</text><text x="590.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chặn)</text><rect x="429.0" y="187.4" width="322.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="203.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lấy danh sách ứng viên: những người có thể nhận</text><text x="590.0" y="219.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thẻ trong bảng</text><rect x="421.0" y="262.8" width="338.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="278.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đọc lịch sử thẻ đã hoàn thành, hồ sơ làm việc, hồ sơ</text><text x="590.0" y="294.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tự khai, trọng số của không gian</text><rect x="420.5" y="336.0" width="339.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tính bốn thành phần: kinh nghiệm (TF-IDF, thẻ tương</text><text x="590.0" y="368.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tự), độ tin cậy, khả dụng, hồ sơ tự khai; kèm độ chắc</text><text x="590.0" y="384.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chắn</text><rect x="416.0" y="425.2" width="348.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="441.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xếp hạng theo trọng số; gắn cảnh báo quá tải hoặc tạm</text><text x="590.0" y="457.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">nghỉ và các thẻ làm bằng chứng</text><rect x="496.5" y="502.8" width="187.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="518.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu lượt gợi ý (AssignRun)</text><rect x="63.0" y="494.8" width="214.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="170.0" y="510.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem xếp hạng, điểm thành phần</text><text x="170.0" y="526.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">và bằng chứng</text><polygon points="170.0,575.5 260.3,600.0 170.0,624.5 79.7,600.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="170.0" y="600.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn người từ gợi ý?</text><rect x="442.5" y="657.2" width="295.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="673.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Giao thẻ cho người được chọn, gửi thông báo</text><text x="590.0" y="689.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cho họ</text><rect x="469.5" y="734.8" width="241.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="590.0" y="750.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghi người được chọn vào lượt gợi ý</text><polygon points="590.0,800.0 783.3,832.0 590.0,864.0 396.7,832.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="590.0" y="824.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đủ điều kiện học? (đủ lượt phản hồi,</text><text x="590.0" y="839.5" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">chọn khác người xếp đầu)</text><rect x="380.0" y="900.8" width="240.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="500.0" y="916.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Cập nhật trọng số theo cặp, chiếu về</text><text x="500.0" y="932.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">miền hợp lệ, lưu lịch sử trọng số</text><polygon points="590.0,977.4 607.0,994.4 590.0,1011.4 573.0,994.4" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><circle cx="590.0" cy="1052.4" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="590.0" cy="1052.4" r="8" fill="#222222"/><circle cx="170.0" cy="681.2" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="170.0" cy="681.2" r="8" fill="#222222"/></svg>