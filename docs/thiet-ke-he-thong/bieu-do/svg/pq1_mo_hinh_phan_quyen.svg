<svg xmlns="http://www.w3.org/2000/svg" width="780" height="704" viewBox="0 0 780 704" font-family="Arial, Helvetica, sans-serif"><rect width="780" height="704" fill="#FFFFFF"/><rect x="20.0" y="20.0" width="230.0" height="58.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="135.0" y="34.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">API REST</text><text x="34.0" y="56.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Mọi thao tác đọc, ghi dữ liệu (/api/...)</text><rect x="275.0" y="20.0" width="230.0" height="58.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="390.0" y="34.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Tệp đính kèm</text><text x="289.0" y="56.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">/uploads/cards/... được kiểm tra quyền,</text><text x="289.0" y="70.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">không phục vụ tĩnh</text><rect x="530.0" y="20.0" width="230.0" height="58.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="645.0" y="34.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Kết nối Socket.IO</text><text x="544.0" y="56.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Bắt tay kết nối và vào phòng bảng</text><rect x="20.0" y="120.0" width="740.0" height="74.0" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.3"/><text x="390.0" y="134.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Lớp 1 - Xác thực: requireAuth, optionalAuth, xác thực bắt tay Socket.IO</text><text x="34.0" y="156.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Đọc JWT trong cookie httpOnly; kiểm tra chữ ký và hạn của token</text><text x="34.0" y="170.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Người dùng còn tồn tại và tokenVersion trong JWT khớp với CSDL; nếu sai: 401 hoặc từ chối kết nối</text><rect x="20.0" y="232.0" width="740.0" height="296.0" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1.2"/><text x="32.0" y="248.0" font-size="13" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="#222222">Lớp 2 - Phân quyền ở tầng nghiệp vụ (gọi ở đầu mỗi thao tác)</text><text x="36.0" y="266.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#444444">Nguồn quyền: vai trò trong bảng (OWNER, ADMIN, MEMBER, VIEWER) · vai trò trong không gian (OWNER, ADMIN, MEMBER)</text><text x="36.0" y="280.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#444444">· chế độ hiển thị của bảng (PRIVATE, WORKSPACE, PUBLIC)</text><rect x="36.0" y="298.0" width="170.0" height="128.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="121.0" y="312.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem: assertBoardView</text><text x="50.0" y="334.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Chủ bảng</text><text x="50.0" y="348.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Thành viên bảng (cả</text><text x="50.0" y="362.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">VIEWER)</text><text x="50.0" y="376.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Thành viên không gian nếu</text><text x="50.0" y="390.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">bảng WORKSPACE</text><text x="50.0" y="404.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Bất kỳ ai nếu bảng PUBLIC</text><rect x="216.0" y="298.0" width="170.0" height="128.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="301.0" y="312.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Sửa: assertBoardAccess</text><text x="230.0" y="334.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Chủ bảng</text><text x="230.0" y="348.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Thành viên bảng trừ VIEWER</text><text x="230.0" y="362.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Thành viên không gian nếu</text><text x="230.0" y="376.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">bảng WORKSPACE</text><rect x="396.0" y="298.0" width="170.0" height="128.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="481.0" y="312.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Quản lý:</text><text x="481.0" y="328.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">assertBoardManage</text><text x="410.0" y="350.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Chủ bảng</text><text x="410.0" y="364.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">ADMIN, OWNER của bảng</text><text x="410.0" y="378.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">OWNER, ADMIN của không</text><text x="410.0" y="392.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">gian chứa bảng</text><rect x="576.0" y="298.0" width="170.0" height="128.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="661.0" y="312.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Chủ sở hữu:</text><text x="661.0" y="328.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">assertBoardOwner</text><text x="590.0" y="350.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Chỉ chủ bảng</text><text x="590.0" y="364.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">(Board.ownerId): lưu trữ, xoá</text><text x="590.0" y="378.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">bảng, chuyển quyền sở hữu</text><polyline points="206.0,362.0 216.0,362.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="206.9,366.2 216.0,362.0 206.9,357.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="386.0,362.0 396.0,362.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="386.9,366.2 396.0,362.0 386.9,357.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="566.0,362.0 576.0,362.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="566.9,366.2 576.0,362.0 566.9,357.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="36.0" y="440.0" width="710.0" height="46.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="391.0" y="455.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Quyền trên không gian: assertWorkspaceAccess (thành viên) · assertWorkspaceManage (ADMIN, OWNER) ·</text><text x="391.0" y="471.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">assertWorkspaceOwner (OWNER)</text><text x="36.0" y="506.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#444444" font-style="italic">Thiếu quyền: 403; với tài nguyên cần giấu sự tồn tại (lượt chạy AI, CV của người khác): 404</text><rect x="20.0" y="574.0" width="340.0" height="54.0" rx="6" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.3"/><text x="190.0" y="601.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Dữ liệu: Prisma Client, PostgreSQL</text><rect x="400.0" y="564.0" width="360.0" height="120.0" rx="6" fill="#FFFDF5" stroke="#1F4E79" stroke-width="1.3"/><text x="580.0" y="578.0" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#222222">Thu hồi quyền tức thì</text><text x="414.0" y="600.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Đổi hoặc đặt lại mật khẩu: tăng tokenVersion, mọi JWT cũ hết hiệu</text><text x="414.0" y="614.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">lực, ngắt mọi socket (disconnectUserSockets)</text><text x="414.0" y="628.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">Xoá thành viên, đổi chế độ hiển thị: đẩy socket khỏi phòng bảng</text><text x="414.0" y="642.0" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">(evictUserFromBoardRoom, reconcileBoardRoomAccess)</text><polyline points="135.0,78.0 135.0,120.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="130.8,110.9 135.0,120.0 139.2,110.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="390.0,78.0 390.0,120.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="385.8,110.9 390.0,120.0 394.2,110.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="645.0,78.0 645.0,120.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="640.8,110.9 645.0,120.0 649.2,110.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="205.0,194.0 205.0,232.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="200.8,222.9 205.0,232.0 209.2,222.9" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="190.2,528.0 190.0,574.0" fill="none" stroke="#222222" stroke-width="1.3"/><polyline points="185.8,564.9 190.0,574.0 194.3,565.0" fill="none" stroke="#222222" stroke-width="1.2"/></svg>