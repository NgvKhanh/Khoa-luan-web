="133.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn không gian làm việc, khoảng</text><text x="160.0" y="149.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thời gian dự án</text><polygon points="160.0,192.7 221.5,217.2 160.0,241.7 98.5,217.2" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="160.0" y="217.2" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Nguồn mô tả?</text><rect x="26.0" y="276.6" width="118.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="85.0" y="292.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Gõ mô tả dự án</text><rect x="172.5" y="268.6" width="119.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="232.0" y="284.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Chọn tệp DOCX</text><text x="232.0" y="300.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">hoặc PDF</text><rect x="456.5" y="276.6" width="167.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="292.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trích xuất chữ trong tệp</text><polygon points="540.0,339.4 557.0,356.4 540.0,373.4 523.0,356.4" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="387.0" y="396.2" width="306.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="412.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra quyền trong không gian; cắt mô tả theo</text><text x="540.0" y="428.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">giới hạn độ dài</text><rect x="383.5" y="471.6" width="313.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="487.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tầng luật: tách dòng, nhận diện tiêu đề, gạch đầu</text><text x="540.0" y="503.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">dòng, biểu thức thời gian, tên thành viên</text><polygon points="540.0,552.3 618.1,576.8 540.0,601.3 461.9,576.8" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="540.0" y="576.8" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đã cấu hình LLM?</text><rect x="777.5" y="552.8" width="195.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="875.0" y="568.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Sinh bản nháp kế hoạch theo</text><text x="875.0" y="584.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">lược đồ JSON</text><polygon points="650.0,627.7 726.6,652.2 650.0,676.7 573.4,652.2" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="650.0" y="652.2" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Bản nháp hợp lệ?</text><rect x="339.0" y="703.6" width="182.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="430.0" y="719.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ghi cảnh báo, chỉ dùng kết</text><text x="430.0" y="735.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">quả tầng luật</text><polygon points="540.0,774.4 557.0,791.4 540.0,808.4 523.0,791.4" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="383.5" y="831.2" width="313.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="847.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Hợp nhất kết quả, lập lịch ngày, kiểm tra bất biến</text><text x="540.0" y="863.2" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">của BoardPlan</text><rect x="391.0" y="900.8" width="298.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="916.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Lưu lượt chạy (AiRun), trả kế hoạch kèm cảnh</text><text x="540.0" y="932.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">báo</text><rect x="51.0" y="900.8" width="218.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="160.0" y="916.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Xem trước, chỉnh sửa tên, ngày,</text><text x="160.0" y="932.8" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">bỏ chọn thẻ</text><polygon points="160.0,975.7 208.5,1000.2 160.0,1024.7 111.5,1000.2" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="160.0" y="1000.2" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo bảng?</text><rect x="371.0" y="1049.4" width="338.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="540.0" y="1065.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra lại kế hoạch và quyền; trong một giao dịch:</text><text x="540.0" y="1081.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đánh dấu lượt chạy đã áp dụng, tạo bảng, danh sách,</text><text x="540.0" y="1097.4" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">thẻ, nhãn</text><rect x="96.5" y="1146.6" width="127.0" height="32.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="160.0" y="1162.6" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở bảng vừa tạo</text><circle cx="160.0" cy="1226.4" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="160.0" cy="1226.4" r="8" fill="#222222"/><circle cx="50.0" cy="1081.4" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="50.0" cy="1081.4" r="8" fill="#222222"/></svg>