="440.3" y="590.0" font-size="11" font-weight="normal" text-anchor="end" dominant-baseline="central" fill="#222222">[Không]</text><polyline points="155.0,624.0 155.0,658.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="151.2,649.8 155.0,658.0 158.8,649.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="505.0,624.5 505.0,652.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="501.2,643.8 505.0,652.0 508.8,643.8" fill="none" stroke="#222222" stroke-width="1.2"/><rect x="508.0" y="629.5" width="26.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="511.0" y="637.5" font-size="11" font-weight="normal" text-anchor="start" dominant-baseline="central" fill="#222222">[Có]</text><polyline points="505.0,716.0 505.0,744.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="501.2,735.8 505.0,744.0 508.8,735.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="505.0,792.0 505.0,846.0 252.5,846.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="260.7,842.2 252.5,846.0 260.7,849.8" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="155.0,870.0 155.0,898.0" fill="none" stroke="#222222" stroke-width="1.2"/><polyline points="151.2,889.8 155.0,898.0 158.8,889.8" fill="none" stroke="#222222" stroke-width="1.2"/><circle cx="155.0" cy="78.0" r="11" fill="#222222"/><rect x="64.0" y="120.0" width="182.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Bấm Quên mật khẩu, nhập</text><text x="155.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email</text><rect x="378.0" y="120.0" width="254.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="136.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Giới hạn số lần thử; kiểm tra định dạng</text><text x="505.0" y="152.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email</text><polygon points="505.0,197.5 588.1,222.0 505.0,246.5 421.9,222.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="505.0" y="222.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Email có tài khoản?</text><rect x="387.0" y="276.0" width="236.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="292.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Tạo mã đặt lại dùng một lần (chỉ lưu</text><text x="505.0" y="308.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">SHA-256, hạn 1 giờ)</text><rect x="718.5" y="268.0" width="133.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="785.0" y="284.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Gửi email chứa</text><text x="785.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">liên kết đặt lại mật</text><text x="785.0" y="316.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khẩu</text><polygon points="505.0,361.0 522.0,378.0 505.0,395.0 488.0,378.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><rect x="362.5" y="420.0" width="285.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="436.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Luôn trả cùng một thông báo, không cho biết</text><text x="505.0" y="452.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">email có tồn tại hay không</text><rect x="57.0" y="498.0" width="196.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="514.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mở liên kết trong email, nhập</text><text x="155.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mật khẩu mới hai lần</text><rect x="359.0" y="498.0" width="292.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="514.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Kiểm tra dữ liệu, băm mật khẩu mới; kiểm tra</text><text x="505.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mã: đúng, chưa dùng, còn hạn</text><polygon points="505.0,575.5 555.7,600.0 505.0,624.5 454.3,600.0" fill="#FFF8E5" stroke="#222222" stroke-width="1.3"/><text x="505.0" y="600.0" font-size="12" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Mã hợp lệ?</text><rect x="51.5" y="576.0" width="207.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="592.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Báo liên kết không hợp lệ hoặc</text><text x="155.0" y="608.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">đã hết hạn</text><circle cx="155.0" cy="672.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="155.0" cy="672.0" r="8" fill="#222222"/><rect x="342.5" y="652.0" width="325.0" height="64.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="668.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Trong một giao dịch: đánh dấu mã đã dùng, đổi mật</text><text x="505.0" y="684.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">khẩu, ghi nhận email đã xác minh, tăng</text><text x="505.0" y="700.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">tokenVersion</text><rect x="342.0" y="744.0" width="326.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="505.0" y="760.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Ngắt mọi kết nối Socket.IO của tài khoản; mọi JWT</text><text x="505.0" y="776.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">cấp trước đó hết hiệu lực</text><rect x="57.5" y="822.0" width="195.0" height="48.0" rx="12" fill="#F2F7FC" stroke="#1F4E79" stroke-width="1.4"/><text x="155.0" y="838.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">Đăng nhập lại bằng mật khẩu</text><text x="155.0" y="854.0" font-size="13" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#222222">mới</text><circle cx="155.0" cy="912.0" r="13" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><circle cx="155.0" cy="912.0" r="8" fill="#222222"/></svg>